services:
  bot:
    build: .
    container_name: attendance-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      # База данных хранится на сервере в папке ./data и не пропадает при обновлении бота
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
